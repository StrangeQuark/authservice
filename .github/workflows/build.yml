
name: AuthService Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux-agent]

    env:
      VAULT_URL: ${{ secrets.VAULT_URL }}
      CICD_TOKEN: ${{ secrets.AUTH_CICD_TOKEN }}
      VAULTSERVICE_ENABLED: ${{ secrets.VAULTSERVICE_ENABLED }}
      KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Retrieve Env Vars from Vault
        run: |
          if [ "$VAULTSERVICE_ENABLED" = "true" ]; then
            echo "Requesting environment variables from Vault..."

            response=$(curl -sS --fail-with-body \
              -X POST \
              -H "X-CICD-TOKEN: $CICD_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"serviceName":"authservice","environmentName":"e3"}' \
              "$VAULT_URL/api/vault/cicd") || {
                echo "Unable to retrieve environment variables from Vault"
                exit 1
              }

            if [ -z "$response" ]; then
              echo "Vault returned an empty environment file"
              exit 1
            fi

            printf '%s\n' "$response" > authservice.env

            echo "Environment variables written to authservice.env"
          fi

      - name: Deploy & Health Check
        run: |
          set -e

          if grep -qx 'KUBERNETES_ENABLED=true' authservice.env; then
            AUTH_SERVICE_IMAGE=$(grep '^AUTH_SERVICE_IMAGE=' authservice.env | cut -d '=' -f2-)

            if [ -z "$AUTH_SERVICE_IMAGE" ]; then
              echo "AUTH_SERVICE_IMAGE must be configured for Kubernetes deployments"
              exit 1
            fi

            if [ -z "$KUBECONFIG_BASE64" ]; then
              echo "KUBECONFIG_BASE64 must be configured for Kubernetes deployments"
              exit 1
            fi

            printf '%s' "$KUBECONFIG_BASE64" | base64 -d > kubeconfig.yaml

            kubectl --kubeconfig kubeconfig.yaml create secret generic authservice-env \
              --from-env-file=authservice.env \
              --dry-run=client \
              -o yaml | kubectl --kubeconfig kubeconfig.yaml apply -f -

            kubectl --kubeconfig kubeconfig.yaml apply -f k8s/auth-db.yaml
            kubectl --kubeconfig kubeconfig.yaml apply -f k8s/auth-rate-limit-redis.yaml

            sed "s|__AUTH_SERVICE_IMAGE__|$AUTH_SERVICE_IMAGE|g" k8s/auth-service.yaml \
              | kubectl --kubeconfig kubeconfig.yaml apply -f -

            kubectl --kubeconfig kubeconfig.yaml rollout status deployment/auth-service --timeout=10m
            exit 0
          fi

          docker compose --env-file authservice.env up --build -d

          max_retries=40
          retry_interval=15
          success=0

          for i in $(seq 1 $max_retries); do
            echo "Health check attempt $i..."

            if response=$(curl -sS -f http://localhost:6001/api/auth/health) && [ "$response" = "200 OK" ]; then
              echo "Authservice is healthy"
              success=1
              break
            else
              echo "Health check failed, retrying in $retry_interval seconds..."
              sleep $retry_interval
            fi
          done

          if [ $success -ne 1 ]; then
            echo "Health check ultimately failed. Tearing down containers."
            docker compose down
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f authservice.env
          rm -f kubeconfig.yaml
          echo "Cleaned up deployment files"
