apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 6001
      targetPort: 6001
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-bootstrap-credentials
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: auth-service
          image: __AUTH_SERVICE_IMAGE__
          ports:
            - containerPort: 6001
          envFrom:
            - secretRef:
                name: authservice-env
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: bootstrap-credentials
              mountPath: /bootstrap
          readinessProbe:
            httpGet:
              path: /api/auth/health
              port: 6001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/auth/health
              port: 6001
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
        - name: bootstrap-credentials
          persistentVolumeClaim:
            claimName: auth-bootstrap-credentials
