# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.platform=h2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable the H2 console for manual querying
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT keys
JWT_PRIVATE_
JWT_PUBLIC_
JWT_ISSUER=msinit-authservice

AUTH_RATE_LIMIT_REDIS_HOST=localhost
AUTH_RATE_LIMIT_REDIS_PORT=6379
AUTH_RATE_LIMIT_REDIS_PASSWORD=change-me
AUTH_RATE_LIMIT_REDIS_CONNECT_TIMEOUT=10s
AUTH_RATE_LIMIT_REDIS_TIMEOUT=10s
LOGIN_RATE_LIMIT_MAX_REQUESTS=10
LOGIN_RATE_LIMIT_WINDOW_MINUTES=15
REGISTER_RATE_LIMIT_MAX_REQUESTS=2
REGISTER_RATE_LIMIT_WINDOW_MINUTES=60
PASSWORD_RESET_RATE_LIMIT_MAX_REQUESTS=3
PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES=60
SERVICE_ACCOUNT_RATE_LIMIT_MAX_REQUESTS=30
SERVICE_ACCOUNT_RATE_LIMIT_WINDOW_MINUTES=1
